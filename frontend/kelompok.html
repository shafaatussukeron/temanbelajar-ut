<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Kelompok Belajar - TemanBelajar UT</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="toast"></div>

    <section id="app">
      <!-- SIDEBAR -->
      <aside>
        <div class="logo">
          <div class="brand-mark small">TB</div>

          <span>
            TemanBelajar
            <br />
            <small>Universitas Terbuka</small>
          </span>
        </div>

        <nav>
          <button onclick="location.href = 'dashboard.html'">
            ⌂
            <span>Dashboard</span>
          </button>

          <button onclick="location.href = 'cari-teman.html'">
            ⌕
            <span>Cari Teman</span>
          </button>

          <button onclick="location.href = 'notifikasi.html'">
            🔔
            <span>
              Notifikasi
              <b id="notificationBadge" class="notification-badge hide">0</b>
            </span>
          </button>

          <button class="active">
            ◫
            <span>Kelompok</span>
          </button>

          <button onclick="location.href = 'mata-kuliah.html'">
            ▣
            <span>Mata Kuliah</span>
          </button>

          <button onclick="location.href = 'profil.html'">
            ◎
            <span>Profil</span>
          </button>

          <div id="adminMenu" class="admin-menu hide">
            <div class="nav-section-title">ADMINISTRATOR</div>

            <button onclick="location.href = 'admin.html'">
              ⚙
              <span>Panel Admin</span>
            </button>
          </div>
        </nav>

        <button class="logout" onclick="logout()">
          ↪
          <span>Logout</span>
        </button>
      </aside>

      <!-- MAIN -->
      <main>
        <header>
          <div>
            <small>RUANG BELAJAR</small>
            <h2>Kelompok Belajar</h2>
          </div>

          <div class="user-chip">
            <div class="mini-avatar" id="avatar">M</div>

            <b id="who"> Mahasiswa </b>
          </div>
        </header>

        <div class="wrap">
          <div class="head">
            <div>
              <h2>Kelompok Belajar</h2>

              <p>
                Gabung atau buat kelompok sesuai mata kuliah dan waktu belajar.
              </p>
            </div>

            <button onclick="openM()">+ Buat Kelompok</button>
          </div>

          <div id="groupList" class="cards"></div>
        </div>
      </main>
    </section>

    <!-- =========================
     MODAL BUAT KELOMPOK
========================== -->

    <div id="modal" class="modal hide">
      <div class="box">
        <button class="x" onclick="closeM()">×</button>

        <h2>Buat Kelompok Belajar</h2>

        <p class="muted">
          Buat ruang belajar kecil berdasarkan mata kuliah dan waktu.
        </p>

        <form onsubmit="createG(event)">
          <!-- Nama Kelompok -->
          <div class="form-group">
            <label for="gn">Nama Kelompok</label>

            <input
              id="gn"
              placeholder="Contoh: Kelompok Belajar Sistem Informasi"
              required
            />
          </div>

          <!-- Mata Kuliah -->
          <div class="form-group">
            <label for="gc">Mata Kuliah</label>

            <select id="gc" required>
              <option value="">Pilih mata kuliah</option>
            </select>
          </div>

          <!-- Deskripsi -->
          <div class="form-group">
            <label for="gd">Deskripsi</label>

            <textarea
              id="gd"
              placeholder="Jelaskan tujuan atau kegiatan kelompok belajar..."
            ></textarea>
          </div>

          <!-- Metode Belajar -->
          <div class="form-group">
            <label for="gm">Metode Belajar</label>

            <select id="gm">
              <option>Online</option>

              <option>Offline</option>

              <option>Online & Offline</option>
            </select>
          </div>

          <!-- Waktu & Kapasitas -->
          <div class="form-row">
            <div class="form-group">
              <label for="gt">Waktu Belajar</label>

              <input
                id="gt"
                value="18:00-21:00"
                placeholder="Contoh: 18:00-21:00"
              />
            </div>

            <div class="form-group">
              <label for="gx">Kapasitas</label>

              <select id="gx">
                <option>3</option>

                <option selected>4</option>

                <option>5</option>

                <option>6</option>
              </select>
            </div>
          </div>

          <!-- Tombol -->
          <button type="submit" class="create-group-btn">
            ✓ Buat Kelompok
          </button>
        </form>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
